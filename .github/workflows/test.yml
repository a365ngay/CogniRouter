name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.8", "3.12"]
        exclude:
          # ubuntu-latest (26.04+) has no Python 3.8 build; keep 3.8 coverage on 24.04.
          - os: ubuntu-latest
            python: "3.8"
        include:
          - os: ubuntu-24.04
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python installer/cognirouter.py install --home ./.ci-home --hosts all --no-upstream
      - run: python installer/cognirouter.py status --home ./.ci-home
