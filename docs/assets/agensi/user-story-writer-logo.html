<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent}svg{display:block}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B5CF0"/>
      <stop offset="1" stop-color="#2E1A7A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#140A3D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- back card: rough idea (tilted sticky note) -->
  <g transform="rotate(-8 190 190)" filter="url(#sh)">
    <rect x="92" y="96" width="196" height="160" rx="18" fill="#FFD866"/>
    <path d="M118 140 q24 -14 48 0 t48 0 t48 0" stroke="#C49A1C" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M118 180 q24 -14 48 0 t48 0" stroke="#C49A1C" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- front card: the finished story -->
  <g filter="url(#sh)">
    <rect x="150" y="176" width="270" height="250" rx="24" fill="#FFFFFF"/>
  </g>
  <!-- story header -->
  <rect x="176" y="204" width="92" height="26" rx="13" fill="#7B5CF0"/>
  <text x="222" y="223" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">US-1</text>
  <rect x="280" y="210" width="112" height="14" rx="7" fill="#D9D1FB"/>

  <!-- three acceptance criteria rows with checks -->
  <g font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#2E1A7A">
    <circle cx="190" cy="268" r="14" fill="#35C27A"/>
    <path d="M183 268 l5 5 l9 -10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="214" y="274">GIVEN</text>
    <rect x="276" y="262" width="116" height="12" rx="6" fill="#E6E1FA"/>

    <circle cx="190" cy="314" r="14" fill="#35C27A"/>
    <path d="M183 314 l5 5 l9 -10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="214" y="320">WHEN</text>
    <rect x="268" y="308" width="124" height="12" rx="6" fill="#E6E1FA"/>

    <circle cx="190" cy="360" r="14" fill="#35C27A"/>
    <path d="M183 360 l5 5 l9 -10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="214" y="366">THEN</text>
    <rect x="264" y="354" width="128" height="12" rx="6" fill="#E6E1FA"/>
  </g>

  <!-- transform arrow from note to card -->
  <circle cx="148" cy="300" r="30" fill="#E0336F" filter="url(#sh)"/>
  <path d="M134 300 h24 m-10 -11 l11 11 l-11 11" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</body></html>
