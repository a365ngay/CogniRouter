<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent}svg{display:block}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F43F5E"/>
      <stop offset="1" stop-color="#7F1D3A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3B0A1A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- database cylinder -->
  <g filter="url(#sh)">
    <path d="M126 150 v212 c0 30 58 54 130 54 s130 -24 130 -54 v-212 z" fill="#FFFFFF"/>
    <ellipse cx="256" cy="150" rx="130" ry="54" fill="#FFE4EA"/>
  </g>
  <ellipse cx="256" cy="150" rx="130" ry="54" fill="#FFE4EA"/>
  <path d="M126 222 c0 30 58 54 130 54 s130 -24 130 -54" fill="none" stroke="#FBCFD9" stroke-width="8"/>
  <path d="M126 294 c0 30 58 54 130 54 s130 -24 130 -54" fill="none" stroke="#FBCFD9" stroke-width="8"/>

  <!-- pulse line -->
  <path d="M70 300 H178 L206 246 L242 352 L278 214 L306 300 H442"
        fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M70 300 H178 L206 246 L242 352 L278 214 L306 300 H442"
        fill="none" stroke="#E11D48" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- plus badge -->
  <g filter="url(#sh)">
    <circle cx="392" cy="122" r="50" fill="#FFD866"/>
  </g>
  <path d="M392 98 v48 M368 122 h48" stroke="#7F1D3A" stroke-width="16" stroke-linecap="round"/>
</svg>
</body></html>
