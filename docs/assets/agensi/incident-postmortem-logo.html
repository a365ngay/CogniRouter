<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent}svg{display:block}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="sh2" filterUnits="userSpaceOnUse" x="240" y="180" width="272" height="260">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- report sheet -->
  <g filter="url(#sh)">
    <rect x="96" y="84" width="290" height="344" rx="24" fill="#FFFFFF"/>
  </g>
  <rect x="124" y="114" width="120" height="16" rx="8" fill="#0F172A"/>
  <rect x="124" y="142" width="180" height="10" rx="5" fill="#CBD5E1"/>

  <!-- timeline -->
  <path d="M146 190 V392" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="146" cy="196" r="12" fill="#94A3B8"/>
  <rect x="172" y="190" width="150" height="12" rx="6" fill="#E2E8F0"/>
  <circle cx="146" cy="250" r="14" fill="#F97316"/>
  <rect x="172" y="244" width="124" height="12" rx="6" fill="#FED7AA"/>
  <circle cx="146" cy="304" r="12" fill="#94A3B8"/>
  <rect x="172" y="298" width="140" height="12" rx="6" fill="#E2E8F0"/>
  <circle cx="146" cy="358" r="12" fill="#22C55E"/>
  <rect x="172" y="352" width="110" height="12" rx="6" fill="#BBF7D0"/>

  <!-- alert badge -->
  <g filter="url(#sh2)">
    <path d="M376 236 L446 360 H306 Z" fill="#FB923C" stroke="#FB923C" stroke-width="22" stroke-linejoin="round"/>
  </g>
  <rect x="368" y="270" width="16" height="50" rx="8" fill="#0F172A"/>
  <circle cx="376" cy="340" r="10" fill="#0F172A"/>
</svg>
</body></html>
