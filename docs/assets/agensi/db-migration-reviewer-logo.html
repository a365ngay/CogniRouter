<!doctype html>
<html><head><meta charset="utf-8">

<body>

      <stop offset="0" stop-color="#F59E0B"/>

    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#431407" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- left table (old schema) -->

    <rect x="66" y="132" width="150" height="190" rx="20" fill="#FFFFFF"/>

  <rect x="66" y="132" width="150" height="44" rx="20" fill="#FFEBC7"/>

  <rect x="88" y="266" width="96" height="12" rx="6" fill="#F3D9B1"/>

  <!-- arrow -->
  <path d="M232 228 H300" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  <path d="M282 200 L312 228 L282 256" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M384 120 L456 148 V232 C456 290 424 330 384 352 C344 330 312 290 312 232 V148 Z" fill="#FFFFFF"/>
  </g>
  <path d="M350 236 L376 262 L422 208" fill="none" stroke="#16A34A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- lock badge -->
  <g filter="url(#sh)">
    <rect x="186" y="352" width="140" height="104" rx="22" fill="#7C2D12"/>
  </g>
  <path d="M220 352 v-22 a36 36 0 0 1 72 0 v22" fill="none" stroke="#7C2D12" stroke-width="18"/>
  <circle cx="256" cy="396" r="13" fill="#FFD866"/>
  <rect x="250" y="400" width="12" height="28" rx="6" fill="#FFD866"/>

</body></html>
