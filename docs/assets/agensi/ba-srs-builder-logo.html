<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:transparent}svg{display:block}</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E6FE0"/>
      <stop offset="1" stop-color="#0B2E63"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#04142E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- back sheet: the SRS document -->
  <g filter="url(#sh)">
    <path d="M112 92 h176 l56 56 v236 a20 20 0 0 1 -20 20 h-212 a20 20 0 0 1 -20 -20 v-272 a20 20 0 0 1 20 -20 z" fill="#FFFFFF"/>
    <path d="M288 92 v40 a16 16 0 0 0 16 16 h40 z" fill="#C9DBF7"/>
  </g>
  <!-- document lines -->
  <rect x="124" y="132" width="112" height="14" rx="7" fill="#0B2E63"/>
  <rect x="124" y="166" width="150" height="10" rx="5" fill="#B7C7DF"/>
  <rect x="124" y="188" width="128" height="10" rx="5" fill="#B7C7DF"/>
  <rect x="124" y="210" width="96" height="10" rx="5" fill="#B7C7DF"/>

  <!-- front card: the UI screen -->
  <g filter="url(#sh)">
    <rect x="196" y="226" width="232" height="186" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="196" y="226" width="232" height="40" rx="22" fill="#EAF1FD"/>
  <rect x="196" y="246" width="232" height="20" fill="#EAF1FD"/>
  <circle cx="220" cy="246" r="6" fill="#F26B5B"/>
  <circle cx="240" cy="246" r="6" fill="#F5B83D"/>
  <circle cx="260" cy="246" r="6" fill="#35C27A"/>
  <!-- sidebar + content blocks -->
  <rect x="214" y="282" width="46" height="112" rx="10" fill="#1E6FE0"/>
  <rect x="274" y="282" width="136" height="38" rx="10" fill="#DCE7F8"/>
  <rect x="274" y="332" width="64" height="62" rx="10" fill="#DCE7F8"/>
  <rect x="346" y="332" width="64" height="62" rx="10" fill="#DCE7F8"/>

  <!-- numbered callouts linking doc and UI -->
  <circle cx="292" cy="301" r="13" fill="#E0336F"/>
  <text x="292" y="306" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <circle cx="370" cy="363" r="13" fill="#E0336F"/>
  <text x="370" y="368" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
</svg>
</body></html>
